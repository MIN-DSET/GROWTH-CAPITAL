<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GROWTH CAPITAL - Login & Register</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #030617;
            color: #F8FAFC;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
        }

        header {
            background-color: #0F172A;
            padding: 22px;
            border-bottom: 1px solid #1E293B;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 1200px;
            margin: auto;
        }

        .logo-icon {
            width: 43px;
            height: 43px;
            background-color: #10B981;
            color: #030617;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 21px;
        }

        .logo h3 {
            color: #34D399;
            font-size: 19px;
            letter-spacing: 0.5px;
        }

        .logo h3 span {
            color: #34bed396;
        }

        main {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 88px);
            padding: 50px 20px;
        }

        .bigbox {
            width: 100%;
            max-width: 520px;
        }

        .welcome {
            text-align: center;
            margin-bottom: 35px;
        }

        .welcome h1 {
            font-size: 36px;
            margin-bottom: 12px;
        }

        .welcome p {
            color: #94A3B8;
            font-size: 16px;
            line-height: 1.6;
        }

        .firstbox {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px;
            width: 100%;
            background-color: #0F172A;
            border: 1px solid #1E293B;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .tab {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 11px;
            background: transparent;
            color: #94A3B8;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.25s;
        }

        .tab.active {
            background-color: #10B981;
            color: #030617;
        }

        .form-group {
            margin-bottom: 23px;
        }

        .form-group label {
            display: block;
            margin-bottom: 11px;
            font-size: 15px;
            font-weight: bold;
            color: #CBD5E1;
        }

        .form-group input {
            width: 100%;
            padding: 17px;
            background-color: #0F172A;
            border: 1px solid #1E293B;
            border-radius: 15px;
            outline: none;
            color: #F8FAFC;
            font-size: 15px;
        }

        .form-group input:focus {
            border-color: #10B981;
        }

        .form-group input::placeholder {
            color: #64748B;
        }

        .optional {
            color: #94A3B8;
            font-size: 12px;
            font-weight: normal;
        }

        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin: 25px 0;
            color: #94A3B8;
            font-size: 14px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .remember input,
        .terms input {
            accent-color: #10B981;
            width: 16px;
            height: 16px;
        }

        a {
            color: #34D399;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 25px 0;
            color: #94A3B8;
            font-size: 13px;
            line-height: 1.7;
        }

        .terms input {
            flex-shrink: 0;
            margin-top: 3px;
        }

        .submit-btn {
            width: 100%;
            padding: 19px;
            border: none;
            border-radius: 15px;
            background-color: #10B981;
            color: #030617;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.25s;
        }

        .submit-btn:hover {
            background-color: #34D399;
            transform: translateY(-2px);
        }

        .bottom-text {
            text-align: center;
            color: #94A3B8;
            font-size: 14px;
            line-height: 1.7;
            margin-top: 25px;
        }

        .hidden {
            display: none;
        }

        .message {
            display: none;
            background-color: #0F2930;
            color: #34D399;
            border: 1px solid #14532D;
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 22px;
            font-size: 14px;
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            header {
                padding: 18px;
            }

            main {
                padding: 45px 22px;
                align-items: flex-start;
            }

            .welcome h1 {
                font-size: 31px;
            }

            .welcome p {
                font-size: 15px;
            }

            .form-group input {
                padding: 16px;
            }

            .submit-btn {
                padding: 17px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <div class="logo-icon">
                <i class="fa-solid fa-chart-line"></i>
            </div>
            <h3>GROWTH <span>CAPITAL</span></h3>
        </div>
    </header>

    <main>
        <section class="bigbox">
            <div class="welcome">
                <h1 id="welcomeTitle">Welcome Back</h1>
                <p id="welcomeText">Access your Growth Capital account.</p>
            </div>

            <div class="firstbox">
                <button class="tab active" id="signInTab" type="button">Sign In</button>
                <button class="tab" id="registerTab" type="button">Register</button>
            </div>

            <div class="message" id="message" role="status"></div>

            <!-- SIGN IN FORM -->
            <form id="signInForm">
                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" placeholder="name@example.com" autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password" autocomplete="current-password" required>
                </div>

                <div class="form-options">
                    <label class="remember">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember me</span>
                    </label>
                    <a href="#" id="forgotPassword">Forgot password?</a>
                </div>

                <button type="submit" class="submit-btn">Sign In to Account</button>

                <p class="bottom-text">
                    Don't have an account?
                    <a href="#" id="goRegister">Create an account</a>
                </p>
            </form>

            <!-- REGISTRATION FORM -->
            <form id="registerForm" class="hidden">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Choose a username" autocomplete="username" minlength="3" required>
                </div>

                <div class="form-group">
                    <label for="registerEmail">Email Address</label>
                    <input type="email" id="registerEmail" placeholder="name@example.com" autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label for="registerPassword">Password</label>
                    <input type="password" id="registerPassword" placeholder="Create a password" autocomplete="new-password" minlength="8" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Enter your password again" autocomplete="new-password" minlength="8" required>
                </div>

                <div class="form-group">
                    <label for="referralCode">
                        Referral Code
                        <span class="optional">(Optional)</span>
                    </label>
                    <input type="text" id="referralCode" placeholder="Enter a referral code if you have one">
                </div>

                <label class="terms">
                    <input type="checkbox" id="acceptTerms" required>
                    <span>
                        I agree to the
                        <a href="#" id="termsLink">Terms and Conditions</a>
                        and
                        <a href="#" id="privacyLink">Privacy Policy</a>.
                    </span>
                </label>

                <button type="submit" class="submit-btn">Create Account</button>

                <p class="bottom-text">
                    Already have an account?
                    <a href="#" id="goSignIn">Sign in</a>
                </p>
            </form>
        </section>
    </main>

    <script>
        const signInTab = document.getElementById("signInTab");
        const registerTab = document.getElementById("registerTab");

        const signInForm = document.getElementById("signInForm");
        const registerForm = document.getElementById("registerForm");

        const welcomeTitle = document.getElementById("welcomeTitle");
        const welcomeText = document.getElementById("welcomeText");

        const message = document.getElementById("message");

        function showMessage(text) {
            message.textContent = text;
            message.style.display = "block";
        }

        function hideMessage() {
            message.textContent = "";
            message.style.display = "none";
        }

        function showSignIn() {
            signInForm.classList.remove("hidden");
            registerForm.classList.add("hidden");

            signInTab.classList.add("active");
            registerTab.classList.remove("active");

            welcomeTitle.textContent = "Welcome Back";
            welcomeText.textContent = "Access your Growth Capital account.";

            hideMessage();
        }

        function showRegister() {
            signInForm.classList.add("hidden");
            registerForm.classList.remove("hidden");

            signInTab.classList.remove("active");
            registerTab.classList.add("active");

            welcomeTitle.textContent = "Create Account";
            welcomeText.textContent = "Join Growth Capital and get started.";

            hideMessage();
        }

        signInTab.addEventListener("click", showSignIn);
        registerTab.addEventListener("click", showRegister);

        document.getElementById("goRegister").addEventListener("click", function(event) {
            event.preventDefault();
            showRegister();
        });

        document.getElementById("goSignIn").addEventListener("click", function(event) {
            event.preventDefault();
            showSignIn();
        });

        document.getElementById("forgotPassword").addEventListener("click", function(event) {
            event.preventDefault();
            showMessage("Password recovery feature coming soon.");
        });

        // SIGN IN FORM SUBMIT: Redirects smoothly to Dashboard.html
        signInForm.addEventListener("submit", function(event) {
            event.preventDefault();
            window.location.href = "Dashboard.html";
        });

        // REGISTRATION FORM SUBMIT
        registerForm.addEventListener("submit", function(event) {
            event.preventDefault();

            const password = document.getElementById("registerPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (password !== confirmPassword) {
                showMessage("Your passwords do not match. Please try again.");
                return;
            }

            window.location.href = "Dashboard.html";
        });

        document.getElementById("termsLink").addEventListener("click", function(event) {
            event.preventDefault();
            showMessage("Terms and Conditions page under maintenance.");
        });

        document.getElementById("privacyLink").addEventListener("click", function(event) {
            event.preventDefault();
            showMessage("Privacy Policy page under maintenance.");
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Growth Capital</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        cardBg: '#131b2e',
                        cardBorder: '#1e293b',
                        brandGreen: '#10b981',
                        brandGreenHover: '#059669',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-darkBg text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- Top Navigation Bar -->
    <header class="flex items-center justify-between px-4 py-4 border-b border-slate-800 bg-darkBg/80 backdrop-blur sticky top-0 z-30">
        <!-- Logo -->
        <a href="Dashboard.html" class="flex items-center space-x-2">
            <div class="bg-brandGreen/20 text-brandGreen p-2 rounded-lg">
                <i class="fa-solid fa-chart-line text-lg"></i>
            </div>
            <span class="font-bold tracking-wider text-sm sm:text-base">GROWTH CAPITAL</span>
        </a>

        <!-- Top Right Actions -->
        <div class="flex items-center space-x-3">
            <!-- Settings Button -->
            <a href="Settings.html" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-2 rounded-xl flex items-center space-x-2 transition border border-slate-700">
                <i class="fa-solid fa-gear text-brandGreen"></i>
                <span class="text-xs font-medium">Settings</span>
            </a>
            
            <!-- Quick Logout Button -->
            <a href="Logout.html" class="bg-slate-800 hover:bg-red-900/40 text-slate-300 hover:text-red-400 p-2.5 rounded-xl transition border border-slate-700">
                <i class="fa-solid fa-right-from-bracket text-sm"></i>
            </a>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto w-full p-4 space-y-5 mb-20">
        
        <!-- Back Button & Header -->
        <div class="flex items-center space-x-3">
            <a href="Settings.html" class="bg-cardBg border border-cardBorder text-slate-300 hover:text-white p-2 rounded-xl text-xs transition">
                <i class="fa-solid fa-chevron-left text-sm"></i>
            </a>
            <div>
                <h1 class="text-lg font-bold text-slate-100">Change Password</h1>
                <p class="text-[11px] text-slate-400">Keep your investment account safe</p>
            </div>
        </div>

        <!-- Success Alert Message -->
        <div id="successAlert" class="hidden bg-emerald-500/10 border border-emerald-500/30 rounded-2xl p-3.5 flex items-center space-x-3 text-emerald-400 text-xs">
            <i class="fa-solid fa-circle-check text-base"></i>
            <span>Password updated successfully!</span>
        </div>

        <!-- Error Alert Message -->
        <div id="errorAlert" class="hidden bg-rose-500/10 border border-rose-500/30 rounded-2xl p-3.5 flex items-center space-x-3 text-rose-400 text-xs">
            <i class="fa-solid fa-circle-xmark text-base"></i>
            <span id="errorMessage">New passwords do not match.</span>
        </div>

        <!-- Change Password Form Card -->
        <form id="passwordForm" onsubmit="handlePasswordUpdate(event)" class="bg-cardBg border border-cardBorder rounded-2xl p-5 space-y-4 shadow-lg">
            
            <!-- Current Password -->
            <div class="space-y-1.5">
                <label for="currentPassword" class="text-xs font-semibold text-slate-300">Current Password</label>
                <div class="flex items-center bg-darkBg border border-slate-800 rounded-xl px-3 py-2.5 focus-within:border-brandGreen transition relative">
                    <i class="fa-solid fa-key text-slate-500 text-xs mr-2.5"></i>
                    <input 
                        type="password" 
                        id="currentPassword" 
                        placeholder="Enter current password" 
                        required 
                        class="bg-transparent text-xs text-slate-100 placeholder-slate-500 w-full outline-none pr-8"
                    />
                    <button type="button" onclick="toggleVisibility('currentPassword', this)" class="absolute right-3 text-slate-500 hover:text-slate-300">
                        <i class="fa-regular fa-eye text-xs"></i>
                    </button>
                </div>
            </div>

            <hr class="border-slate-800/80 my-2">

            <!-- New Password -->
            <div class="space-y-1.5">
                <label for="newPassword" class="text-xs font-semibold text-slate-300">New Password</label>
                <div class="flex items-center bg-darkBg border border-slate-800 rounded-xl px-3 py-2.5 focus-within:border-brandGreen transition relative">
                    <i class="fa-solid fa-lock text-slate-500 text-xs mr-2.5"></i>
                    <input 
                        type="password" 
                        id="newPassword" 
                        placeholder="Enter new password" 
                        oninput="checkPasswordStrength()"
                        required 
                        class="bg-transparent text-xs text-slate-100 placeholder-slate-500 w-full outline-none pr-8"
                    />
                    <button type="button" onclick="toggleVisibility('newPassword', this)" class="absolute right-3 text-slate-500 hover:text-slate-300">
                        <i class="fa-regular fa-eye text-xs"></i>
                    </button>
                </div>
                
                <!-- Strength Indicator Bar -->
                <div class="space-y-1 pt-1">
                    <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
                        <div id="strengthBar" class="h-full bg-slate-700 transition-all duration-300" style="width: 0%;"></div>
                    </div>
                    <p id="strengthLabel" class="text-[10px] text-slate-500">Strength: Too short</p>
                </div>
            </div>

            <!-- Confirm New Password -->
            <div class="space-y-1.5">
                <label for="confirmPassword" class="text-xs font-semibold text-slate-300">Confirm New Password</label>
                <div class="flex items-center bg-darkBg border border-slate-800 rounded-xl px-3 py-2.5 focus-within:border-brandGreen transition relative">
                    <i class="fa-solid fa-lock text-slate-500 text-xs mr-2.5"></i>
                    <input 
                        type="password" 
                        id="confirmPassword" 
                        placeholder="Re-enter new password" 
                        required 
                        class="bg-transparent text-xs text-slate-100 placeholder-slate-500 w-full outline-none pr-8"
                    />
                    <button type="button" onclick="toggleVisibility('confirmPassword', this)" class="absolute right-3 text-slate-500 hover:text-slate-300">
                        <i class="fa-regular fa-eye text-xs"></i>
                    </button>
                </div>
            </div>

            <!-- Security Guidelines -->
            <div class="bg-darkBg/60 p-3 rounded-xl border border-slate-800/80 space-y-1 text-[10px] text-slate-400">
                <span class="font-bold text-slate-300 block mb-1">Password Requirements:</span>
                <p class="flex items-center"><i class="fa-solid fa-check text-brandGreen mr-1.5 text-[8px]"></i> At least 8 characters long</p>
                <p class="flex items-center"><i class="fa-solid fa-check text-brandGreen mr-1.5 text-[8px]"></i> Include at least one number or symbol</p>
            </div>

            <!-- Submit Button -->
            <button 
                type="submit" 
                class="w-full bg-brandGreen hover:bg-brandGreenHover text-darkBg font-bold py-3 rounded-xl text-xs transition shadow-md shadow-brandGreen/20 flex items-center justify-center space-x-2">
                <i class="fa-solid fa-shield-halved"></i>
                <span>Update Password</span>
            </button>
        </form>

    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-darkBg/95 backdrop-blur border-t border-slate-800 py-3 px-6 flex justify-around items-center z-20 max-w-md mx-auto">
        <a href="Dashboard.html" class="flex flex-col items-center text-slate-400 hover:text-slate-200 space-y-1 transition">
            <i class="fa-solid fa-house text-base"></i>
            <span class="text-[10px] font-medium">Home</span>
        </a>
        <a href="Investment.html" class="flex flex-col items-center text-slate-400 hover:text-slate-200 space-y-1 transition">
            <i class="fa-solid fa-chart-pie text-base"></i>
            <span class="text-[10px] font-medium">Tiers</span>
        </a>
        <a href="Refer.html" class="flex flex-col items-center text-slate-400 hover:text-slate-200 space-y-1 transition">
            <i class="fa-solid fa-users text-base"></i>
            <span class="text-[10px] font-medium">Referrals</span>
        </a>
    </nav>

    <!-- JavaScript Handlers -->
    <script>
        function toggleVisibility(inputId, button) {
            const input = document.getElementById(inputId);
            const icon = button.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        function checkPasswordStrength() {
            const pass = document.getElementById('newPassword').value;
            const bar = document.getElementById('strengthBar');
            const label = document.getElementById('strengthLabel');

            if (pass.length === 0) {
                bar.style.width = '0%';
                label.innerText = 'Strength: Too short';
                label.className = 'text-[10px] text-slate-500';
            } else if (pass.length < 6) {
                bar.style.width = '33%';
                bar.className = 'h-full bg-rose-500 transition-all duration-300';
                label.innerText = 'Strength: Weak';
                label.className = 'text-[10px] text-rose-400';
            } else if (pass.length < 10) {
                bar.style.width = '66%';
                bar.className = 'h-full bg-amber-500 transition-all duration-300';
                label.innerText = 'Strength: Medium';
                label.className = 'text-[10px] text-amber-400';
            } else {
                bar.style.width = '100%';
                bar.className = 'h-full bg-brandGreen transition-all duration-300';
                label.innerText = 'Strength: Strong';
                label.className = 'text-[10px] text-brandGreen';
            }
        }

        function handlePasswordUpdate(e) {
            e.preventDefault();
            const newPass = document.getElementById('newPassword').value;
            const confirmPass = document.getElementById('confirmPassword').value;
            const successAlert = document.getElementById('successAlert');
            const errorAlert = document.getElementById('errorAlert');

            if (newPass !== confirmPass) {
                successAlert.classList.add('hidden');
                errorAlert.classList.remove('hidden');
                return;
            }

            errorAlert.classList.add('hidden');
            successAlert.classList.remove('hidden');

            document.getElementById('passwordForm').reset();
            checkPasswordStrength();

            setTimeout(() => {
                successAlert.classList.add('hidden');
            }, 3500);
        }
    </script>

</body>
</html>

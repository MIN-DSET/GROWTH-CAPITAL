<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Username - Growth Capital</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        cardBg: '#131b2e',
                        cardBorder: '#1e293b',
                        brandGreen: '#10b981',
                        brandGreenHover: '#059669',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-darkBg text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- Top Navigation Bar -->
    <header class="flex items-center justify-between px-4 py-4 border-b border-slate-800 bg-darkBg/80 backdrop-blur sticky top-0 z-30">
        <!-- Logo -->
        <a href="Dashboard.html" class="flex items-center space-x-2">
            <div class="bg-brandGreen/20 text-brandGreen p-2 rounded-lg">
                <i class="fa-solid fa-chart-line text-lg"></i>
            </div>
            <span class="font-bold tracking-wider text-sm sm:text-base">GROWTH CAPITAL</span>
        </a>

        <!-- Top Right Actions -->
        <div class="flex items-center space-x-3">
            <!-- Settings Button -->
            <a href="Settings.html" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-2 rounded-xl flex items-center space-x-2 transition border border-slate-700">
                <i class="fa-solid fa-gear text-brandGreen"></i>
                <span class="text-xs font-medium">Settings</span>
            </a>
            
            <!-- Quick Logout Button -->
            <a href="Logout.html" class="bg-slate-800 hover:bg-red-900/40 text-slate-300 hover:text-red-400 p-2.5 rounded-xl transition border border-slate-700">
                <i class="fa-solid fa-right-from-bracket text-sm"></i>
            </a>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto w-full p-4 space-y-5 mb-20">
        
        <!-- Back Button & Header -->
        <div class="flex items-center space-x-3">
            <a href="Settings.html" class="bg-cardBg border border-cardBorder text-slate-300 hover:text-white p-2 rounded-xl text-xs transition">
                <i class="fa-solid fa-chevron-left text-sm"></i>
            </a>
            <div>
                <h1 class="text-lg font-bold text-slate-100">Change Username</h1>
                <p class="text-[11px] text-slate-400">Update your account handle</p>
            </div>
        </div>

        <!-- Current Profile Overview Card -->
        <div class="bg-cardBg border border-cardBorder rounded-2xl p-4 flex items-center justify-between shadow-md">
            <div class="flex items-center space-x-3">
                <div class="bg-brandGreen/10 text-brandGreen p-3 rounded-xl border border-brandGreen/20">
                    <i class="fa-solid fa-user-pen text-lg"></i>
                </div>
                <div>
                    <span class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Current Username</span>
                    <h3 class="text-sm font-bold text-slate-200">Alex Johnson</h3>
                </div>
            </div>
            <span class="bg-slate-800 text-slate-400 text-[10px] px-2.5 py-1 rounded-full border border-slate-700">Active</span>
        </div>

        <!-- Success Alert Message (Hidden by default) -->
        <div id="successAlert" class="hidden bg-emerald-500/10 border border-emerald-500/30 rounded-2xl p-3.5 flex items-center space-x-3 text-emerald-400 text-xs">
            <i class="fa-solid fa-circle-check text-base"></i>
            <span>Username updated successfully!</span>
        </div>

        <!-- Username Form Card -->
        <form id="usernameForm" onsubmit="handleUsernameUpdate(event)" class="bg-cardBg border border-cardBorder rounded-2xl p-5 space-y-4 shadow-lg">
            
            <!-- New Username Field -->
            <div class="space-y-1.5">
                <label for="newUsername" class="text-xs font-semibold text-slate-300">New Username</label>
                <div class="flex items-center bg-darkBg border border-slate-800 rounded-xl px-3 py-2.5 focus-within:border-brandGreen transition">
                    <i class="fa-solid fa-user text-slate-500 text-xs mr-2.5"></i>
                    <input 
                        type="text" 
                        id="newUsername" 
                        placeholder="Enter new username" 
                        required 
                        class="bg-transparent text-xs text-slate-100 placeholder-slate-500 w-full outline-none"
                    />
                </div>
            </div>

            <!-- Confirm Password Field -->
            <div class="space-y-1.5">
                <label for="accountPassword" class="text-xs font-semibold text-slate-300">Confirm Account Password</label>
                <div class="flex items-center bg-darkBg border border-slate-800 rounded-xl px-3 py-2.5 focus-within:border-brandGreen transition">
                    <i class="fa-solid fa-lock text-slate-500 text-xs mr-2.5"></i>
                    <input 
                        type="password" 
                        id="accountPassword" 
                        placeholder="Enter your current password" 
                        required 
                        class="bg-transparent text-xs text-slate-100 placeholder-slate-500 w-full outline-none"
                    />
                </div>
            </div>

            <!-- Notice Text -->
            <p class="text-[10px] text-slate-400 bg-darkBg/60 p-2.5 rounded-xl border border-slate-800/80 leading-relaxed">
                <i class="fa-solid fa-circle-info text-brandGreen mr-1"></i>
                Changing your username will update how your name displays across your dashboard and referral profile.
            </p>

            <!-- Submit Button -->
            <button 
                type="submit" 
                class="w-full bg-brandGreen hover:bg-brandGreenHover text-darkBg font-bold py-3 rounded-xl text-xs transition shadow-md shadow-brandGreen/20 flex items-center justify-center space-x-2">
                <i class="fa-solid fa-check-double"></i>
                <span>Save New Username</span>
            </button>
        </form>

    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-darkBg/95 backdrop-blur border-t border-slate-800 py-3 px-6 flex justify-around items-center z-20 max-w-md mx-auto">
        <a href="Dashboard.html" class="flex flex-col items-center text-slate-400 hover:text-slate-200 space-y-1 transition">
            <i class="fa-solid fa-house text-base"></i>
            <span class="text-[10px] font-medium">Home</span>
        </a>
        <a href="Investment.html" class="flex flex-col items-center text-slate-400 hover:text-slate-200 space-y-1 transition">
            <i class="fa-solid fa-chart-pie text-base"></i>
            <span class="text-[10px] font-medium">Tiers</span>
        </a>
        <a href="Refer.html" class="flex flex-col items-center text-slate-400 hover:text-slate-200 space-y-1 transition">
            <i class="fa-solid fa-users text-base"></i>
            <span class="text-[10px] font-medium">Referrals</span>
        </a>
    </nav>

    <!-- JavaScript Handlers -->
    <script>
        function handleUsernameUpdate(e) {
            e.preventDefault();
            const alertBox = document.getElementById('successAlert');
            alertBox.classList.remove('hidden');
            
            document.getElementById('newUsername').value = '';
            document.getElementById('accountPassword').value = '';

            setTimeout(() => {
                alertBox.classList.add('hidden');
            }, 3000);
        }
    </script>

</body>
</html>
